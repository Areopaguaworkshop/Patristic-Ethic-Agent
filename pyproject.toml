[project]
name = "patristic-ethics"
version = "0.0.1"
description = "PEA (Patristic Ethics Agent) - a runtime ethics layer for LLM agent hosts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "ollama>=0.6.3,<0.7",
    "pydantic>=2.9",
]

[project.scripts]
pea = "patristic_ethics.cli:main"
pea-controlled = "patristic_ethics.controlled:main"
pea-controlled-claude = "patristic_ethics.claude_controlled:main"
pea-operator = "patristic_ethics.operator:main"
pea-mcp = "patristic_ethics.mcp_server:main"
pea-codex-hook = "patristic_ethics.adapters.codex:main"
pea-claude-hook = "patristic_ethics.adapters.claude_code:main"

[project.urls]
Homepage = "https://github.com/Areopaguaworkshop/Patristic-Ethic-Agent"
Repository = "https://github.com/Areopaguaworkshop/Patristic-Ethic-Agent"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patristic_ethics"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
