[project]
name = "patristic-ethics"
version = "0.0.1"
description = "PEA (Patristic Ethics Agent) - ethics middleware probes for LLM agent hosts"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "ollama>=0.6.3,<0.7",
    "pydantic>=2.9",
]

[project.scripts]
pea = "patristic_ethics.cli:main"
pea-controlled = "patristic_ethics.controlled:main"
pea-controlled-claude = "patristic_ethics.claude_controlled:main"
pea-operator = "patristic_ethics.operator:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patristic_ethics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
